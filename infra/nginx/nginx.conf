events {

}

http {
  # Uploads (campagne attachments, documents) go up to 100MB (see each
  # service's own multer limits) — nginx's 1MB default would otherwise
  # reject them with 413 before the request even reaches the service.
  client_max_body_size 100M;

  server {
    listen 80;

    # Real client IP forwarded through — every service's audit log
    # (LOGIN, LOGIN_ATTEMPT, ...) captures req.ip, which without this would
    # show the gateway container's internal address instead of the actual
    # caller. Each service must call app.set("trust proxy", 1) for Express
    # to read this instead of the raw socket peer address (see app.ts).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ambassade-api — same flat-path prefix list the frontend used to
    # apply client-side (see frontend-embassy's lib/api.ts, now a single
    # constant base URL instead of this routing logic). Keep both lists in
    # sync if a new ambassade-api module is mounted at a new root path.
    location /services { proxy_pass http://ambassade-api:4002; }
    location /sub-services { proxy_pass http://ambassade-api:4002; }
    location /schedules { proxy_pass http://ambassade-api:4002; }
    location /exceptions { proxy_pass http://ambassade-api:4002; }
    location /requirements { proxy_pass http://ambassade-api:4002; }
    location /document-categories { proxy_pass http://ambassade-api:4002; }
    location /documents { proxy_pass http://ambassade-api:4002; }
    location /internal-documents { proxy_pass http://ambassade-api:4002; }
    location /demandes { proxy_pass http://ambassade-api:4002; }
    location /agenda-slots { proxy_pass http://ambassade-api:4002; }
    location /rendez-vous { proxy_pass http://ambassade-api:4002; }
    location /communication { proxy_pass http://ambassade-api:4002; }
    location /notifications { proxy_pass http://ambassade-api:4002; }
    location /audit { proxy_pass http://ambassade-api:4002; }
    location /agent-requests { proxy_pass http://ambassade-api:4002; }
    location /support-tickets { proxy_pass http://ambassade-api:4002; }
    location /culture { proxy_pass http://ambassade-api:4002; }
    location /reception { proxy_pass http://ambassade-api:4002; }
    location /threads { proxy_pass http://ambassade-api:4002; }
    location /assignments { proxy_pass http://ambassade-api:4002; }
    location /etudiants { proxy_pass http://ambassade-api:4002; }

    # /agents itself (list/create/update/delete accounts) stays on
    # identity-api (falls through to the default location below); only its
    # schedule sub-resources belong to ambassade-api.
    location ~ ^/agents/[^/]+/(availabilities|exceptions|assignments) {
      proxy_pass http://ambassade-api:4002;
    }

    # communaute-api — student/community-facing endpoints, once built.
    location /api/communaute/ {
      proxy_pass http://communaute-api:4003/;
    }

    # Everything else defaults to identity-api (auth, users, agents, roles,
    # profile, ...).
    location / {
      proxy_pass http://identity-api:4001;
    }
  }
}
