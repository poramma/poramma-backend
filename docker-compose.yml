services:
  db:
    image: postgres:16-alpine
    container_name: fivision-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: fivision-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: fivision-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  mailhog:
    image: mailhog/mailhog
    container_name: fivision-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  identity-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/identity-api/Dockerfile
    container_name: fivision-identity
    env_file: .env
    depends_on:
      - db
      - redis
      - mailhog
    ports:
      - "4001:4001"
    volumes:
      - ./services/identity-api/dist:/app/services/identity-api/dist

  ambassade-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/ambassade-api/Dockerfile
    container_name: fivision-ambassade
    env_file: .env
    depends_on:
      - db
      - redis
      - identity-api
    ports:
      - "4002:4002"
    volumes:
      - ./services/ambassade-api/dist:/app/services/ambassade-api/dist

  communaute-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/communaute-api/Dockerfile
    container_name: fivision-communaute
    env_file: .env
    depends_on:
      - db
      - redis
      - identity-api
    ports:
      - "4003:4003"
    volumes:
      - ./services/communaute-api/dist:/app/services/communaute-api/dist

  gateway:
    image: nginx:alpine
    container_name: fivision-gateway
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - identity-api
      - ambassade-api
      - communaute-api

volumes:
  pgdata:
  minio:

