services:
  db:
    image: postgres:16-alpine
    container_name: poramma-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: poramma-redis
    ports:
      - "6379:6379"

  minio:
    # Docker Hub's minio/minio repo is no longer publicly pullable (MinIO Inc.
    # moved distribution to quay.io) — pull access denied otherwise.
    image: quay.io/minio/minio:latest
    container_name: poramma-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  mailhog:
    image: mailhog/mailhog
    container_name: poramma-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  identity-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/identity-api/Dockerfile
    container_name: poramma-identity
    env_file:
      - .env
      # Identifiants SMTP réels (git-ignorés) : surchargent SMTP_* de .env quand le fichier existe.
      - path: .env.smtp
        required: false
    environment:
      # PORT cannot live in the shared .env: all three services read the same
      # file, so it is set per-service here to match the Dockerfile EXPOSE.
      PORT: 4001
    depends_on:
      - db
      - redis
      - mailhog
    ports:
      - "4001:4001"
    volumes:
      - ./services/identity-api/dist:/app/dist

  ambassade-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/ambassade-api/Dockerfile
    container_name: poramma-ambassade
    env_file:
      - .env
      # Identifiants SMTP réels (git-ignorés) : surchargent SMTP_* de .env quand le fichier existe.
      - path: .env.smtp
        required: false
    environment:
      PORT: 4002
    depends_on:
      - db
      - redis
      - identity-api
    ports:
      - "4002:4002"
    volumes:
      - ./services/ambassade-api/dist:/app/dist

  communaute-api:
    build:
      context: . # <-- Racine du monorepo
      dockerfile: services/communaute-api/Dockerfile
    container_name: poramma-communaute
    env_file:
      - .env
      # Identifiants SMTP réels (git-ignorés) : surchargent SMTP_* de .env quand le fichier existe.
      - path: .env.smtp
        required: false
    environment:
      PORT: 4003
    depends_on:
      - db
      - redis
      - identity-api
    ports:
      - "4003:4003"
    volumes:
      - ./services/communaute-api/dist:/app/dist

  gateway:
    image: nginx:alpine
    container_name: poramma-gateway
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - identity-api
      - ambassade-api
      - communaute-api

volumes:
  pgdata:
  minio:

